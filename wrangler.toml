name = "quickqr-staging"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-19"

# Git builds of the quickqr (production) Pages project read their build env vars from here.
# Cloudflare's image ships bun 1.2.15, which cannot parse bun.lock (lockfileVersion 2, written
# by bun 1.4.x), so pin the version that wrote the lockfile. Keep it equal to `bun --version`
# whenever the lockfile is regenerated.
[vars]
BUN_VERSION = "1.4.0"
