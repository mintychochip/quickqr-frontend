name = "quickqr"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-13"

# Production: the Git-connected `quickqr` Pages project. Staging is staging/wrangler.toml.
#
# Secrets are set on the project, never here:
#   bunx wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name quickqr
#   bunx wrangler pages secret put SCAN_HASH_KEY --project-name quickqr     (any long random string)

[vars]
# Cloudflare's image ships bun 1.2.15, which cannot parse bun.lock (lockfileVersion 2, written
# by bun 1.4.x), so pin the version that wrote the lockfile. Keep it equal to `bun --version`
# whenever the lockfile is regenerated.
BUN_VERSION = "1.4.0"
OAUTH_REDIRECT_ORIGIN = "https://quickqr.app"
APP_PUBLIC_URL = "https://quickqr.app"
# The public origin for hosted sites. The app origin 301s /s/ here.
SITES_PUBLIC_URL = "https://sites.quickqr.app"
# A client id is public: it appears in every sign-in URL.
GOOGLE_CLIENT_ID = "488834070117-krb6561gmj74nkbto5oel0b36klqvohf.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "quickqr-prod"
database_id = "b83ff4c1-f4f1-4ccc-a1da-7ced89c5ab45"
migrations_dir = "edge/migrations"

# Hosted site files. The bucket must exist before this binding is deployed:
#   bunx wrangler r2 bucket create quickqr-sites
[[r2_buckets]]
binding = "SITES"
bucket_name = "quickqr-sites"

# Preview deployments (every branch but master) are built from this same file, and without this section they would use
# the production database above. They get the staging one instead, and no Google client id, so a preview can neither
# sign anyone in nor touch real data. The origins are staging's only to keep the sign-in stand-in off: it turns on
# whenever every named origin is loopback, and naming none falls back to localhost.
[env.preview.vars]
BUN_VERSION = "1.4.0"
OAUTH_REDIRECT_ORIGIN = "https://staging.quickqr.app"
APP_PUBLIC_URL = "https://staging.quickqr.app"
SITES_PUBLIC_URL = "https://staging.sites.quickqr.app"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "quickqr-staging"
database_id = "619f58ec-9a6d-4ec9-a034-1ff192636164"
migrations_dir = "edge/migrations"

[[env.preview.r2_buckets]]
binding = "SITES"
bucket_name = "quickqr-sites-staging"
